[project]
# Vercel's Python builder drives `uv`, which requires a real project table here;
# without it the deploy fails at `uv lock`. Keep these in step with
# requirements.txt (that file, plus requirements.lock, is what non-uv installs use).
name = "pokedex-chat"
version = "1.0.0"
description = "A grounded Pokemon analyst: every number computed by SQL over a local Pokedex."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.1",
  "uvicorn[standard]==0.51.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlglot==30.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: the modules sit at the repo root, so name them rather than letting
# setuptools guess (it would otherwise try to package data/, static/, tests/...).
py-modules = ["config", "security", "observability", "pokedb", "sprites", "agent", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "assets", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends/Header in defaults is the documented idiom
  "RUF001",  # unicode punctuation in prose is deliberate
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # sys.path juggling before imports is intentional there
"evals/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
