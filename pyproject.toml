[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "assets", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends/Header in defaults is the documented idiom
  "RUF001",  # unicode punctuation in prose is deliberate
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # sys.path juggling before imports is intentional there
"evals/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
