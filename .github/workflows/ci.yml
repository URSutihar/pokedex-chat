name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"     # weekly: catch advisories in pinned deps

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets first: a leaked key is the one failure you cannot roll back.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks needs history to scan it
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy --ignore-missing-imports config.py security.py observability.py pokedb.py agent.py server.py

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # The database is not in git. Build it — which also tests build_db.py.
      - name: fetch PokeAPI CSVs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/pokeapi.git _src
          git -C _src sparse-checkout set data/v2/csv
          mkdir -p data/csv && mv _src/data/v2/csv/*.csv data/csv/ && rm -rf _src
      - run: python build_db.py

      # Sprite resolution is tested, so a handful of real files must exist.
      - name: fetch a sprite sample
        run: |
          mkdir -p assets/sprites/pokemon/other/official-artwork assets/sprites/items
          base=https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites
          for id in 6 25 257 445 740 10035; do
            curl -sfL "$base/pokemon/other/official-artwork/$id.png" \
              -o "assets/sprites/pokemon/other/official-artwork/$id.png"
          done
          curl -sfL "$base/items/life-orb.png" -o assets/sprites/items/life-orb.png

      - run: pytest -q

      # Offline half of the golden dataset: proves the expected answers still
      # match the freshly built database. Spends no tokens.
      - run: python evals/run_eval.py

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.lock --strict

  docker:
    name: image builds
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
